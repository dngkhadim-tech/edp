<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" fill="none">
  <!-- E : crochet gauche + barre centrale -->
  <polyline points="135,20 28,20 28,180 135,180"
    stroke="currentColor" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <line x1="28" y1="95" x2="115" y2="95"
    stroke="currentColor" stroke-width="13" stroke-linecap="square"/>

  <!-- D : verticale gauche + courbe D complète -->
  <line x1="178" y1="20" x2="178" y2="180"
    stroke="currentColor" stroke-width="13" stroke-linecap="square"/>
  <path d="M178 20 H238 Q318 20 318 100 Q318 180 238 180 H178"

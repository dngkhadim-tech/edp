  <!-- P : verticale gauche + demi-courbe haute seulement -->
  <line x1="368" y1="20" x2="368" y2="180"
    stroke="currentColor" stroke-width="13" stroke-linecap="square"/>
  <path d="M368 20 H428 Q508 20 508 92 Q508 100 428 100 H368"
    stroke="currentColor" stroke-width="13" stroke-linejoin="round" fill="none"/>

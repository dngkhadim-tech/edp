apiVersion: apps/v1
kind: Deployment
metadata:
  name: edp-api
  namespace: edp
  labels:
    app: edp-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: edp-api
    spec:
      containers:
        - name: edp-api
          image: ghcr.io/your-org/edp-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: edp-secrets
            - configMapRef:
                name: edp-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edp-api
  namespace: edp
spec:
  selector:
    app: edp-api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edp-api-hpa
  namespace: edp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edp-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

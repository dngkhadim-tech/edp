upstream edp_web {
    server web:3000;
}

upstream edp_api {
    server api:4000;
}

server {
    listen 80;
    server_name edp.app api.edp.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edp.app;

    ssl_certificate /etc/letsencrypt/live/edp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edp.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    location / {
        proxy_pass http://edp_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.edp.app;

    ssl_certificate /etc/letsencrypt/live/edp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edp.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    location / {
        proxy_pass http://edp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
